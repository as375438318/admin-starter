version: 2

updates:
  # 后端依赖（Maven 多模块）
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # 主版本升级会破坏兼容（Spring Boot 4 / 校验器 3.x 等），且 `AGENTS.md` §9-B 规定技术栈版本
    # 以该节为唯一定义处、升级需走评估。因此主版本由人手动发起并开 CR/ADR。
    #
    # 另外：Java 生态里"框架核心"的 minor 实质就是框架升级，不能按普通 minor 自动合：
    # - spring-boot-starter-parent：minor 会连带 Spring Framework / Security 版本线
    # - mybatis-plus-*：3.5.9 起把 JSqlParser 拆成独立依赖（mybatis-plus-jsqlparser），
    #   直接升会让 `net.sf.jsqlparser.expression.Expression` 编译不过（2026-11-12 实测，见 CR-20261112-019）
    # - springdoc-*、mapstruct*：与 Spring 版本强绑定
    # 这些依赖只收 patch。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "com.baomidou:mybatis-plus-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "org.mapstruct:*"
        update-types: ["version-update:semver-minor"]
    groups:
      # 小版本/补丁合并成一个 PR，避免每周开十几个 PR 互相冲突
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 前端依赖（pnpm workspace，根目录 package.json 为入口）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # 同上：前端主版本（Vite 5→8、Pinia 2→4、vue-router 4→5）必须评估后再升，
    # 单元测试通过不代表运行时没坏（我们的单测覆盖不到类型/插件生态的全部破坏面）。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions 自身版本（避免 actions/checkout 等长期停留在过期版本）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

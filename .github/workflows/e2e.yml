name: E2E

# 端到端冒烟（ADR-006 第 2 步）：只保 3–5 条主链路。
# 为什么不进每次提交的必跑集：需要编排 MySQL + Redis + 后端 + 前端四个进程，耗时与失败面都远大于单元测试。
# 触发方式：手动（workflow_dispatch）；后续可加 nightly 定时。
#
# 首次使用请手动触发一次并确认：本工作流尚未在 GitHub Actions 上实测（本地已跑通，见 docs/audit/impl-notes.md）。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E 冒烟（登录 / 权限 / 数据范围 / 刷新续期）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: admin_starter
          MYSQL_USER: admin_app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        env:
          REDIS_PASSWORD: ci-redis-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_DB_USERNAME: admin_app
      APP_DB_PASSWORD: ci-app-password
      APP_REDIS_HOST: 127.0.0.1
      APP_REDIS_PORT: '6379'
      APP_REDIS_PASSWORD: ci-redis-password
      E2E_API_URL: http://127.0.0.1:8080/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        working-directory: server
        run: mvn -B -pl web -am -DskipTests package

      - name: Start backend
        run: |
          java -jar server/web/target/admin-starter.jar \
            --spring.datasource.url='jdbc:mysql://127.0.0.1:3306/admin_starter?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true' \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/v1/health > /dev/null; then
              echo "backend ready after ${i}0s"; exit 0
            fi
            sleep 2
          done
          echo "backend 未就绪，输出最后 100 行日志"; tail -n 100 /tmp/backend.log; exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # CI 里没有本机 Chrome，改用 Playwright 自带 chromium
      - name: Install Playwright browser
        run: pnpm --filter @admin-starter/pc exec playwright install --with-deps chromium

      - name: Run E2E
        working-directory: apps/pc
        env:
          E2E_CHANNEL: none
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/pc/playwright-report
          retention-days: 7

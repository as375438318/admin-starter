name: CI

# 三条门禁，对应 AGENTS.md §7 的 error 级阻断：
#   1. spec-lint  —— 文档/编号/路径/配置台账/TODO 一致性（零依赖，最快，先跑）
#   2. backend    —— Maven 多模块编译 + **集成测试**（JDK 17 + MySQL/Redis 服务容器）
#   3. frontend   —— Vitest 单元测试 + vue-tsc 类型检查 + Vite 生产构建
#
# 后端测试说明（2026-11-11 起）：
# - 集成测试用 profile `test`，默认连 `admin_starter_test`，连接参数全部可用环境变量覆盖；
#   测试类里有一条安全断言：库名不含 test 就失败，避免误连开发库/生产库。
# - CI 用 GitHub Actions 的 services 起 MySQL 8 + Redis 7，通过 APP_TEST_DB_* / APP_REDIS_* 注入，
#   不需要 Testcontainers、也不需要本机 Docker。
# - 契约测试已落地（2026-11-11，CR-20261111-004/006）：`web` 模块的 ContractValidationTest 用
#   swagger-request-validator 比对 docs/api/openapi.yaml 本体，覆盖公开配置、401 结构与 4 个受保护接口；
#   随 `mvn verify` 一起跑，不单独设 job（避免重复下载依赖）。
# - 仍未覆盖：契约里其余需登录的写接口（需请求体夹具），以及业务行为断言（那属单元/集成测试范畴）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-lint:
    name: 文档门禁（spec-lint）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 零第三方依赖，直接用仓库自带的 Node 脚本；退出码 1 = 存在 error，直接失败
      - name: Run spec-lint
        run: node tools/spec-lint/cli.mjs

  backend:
    name: 后端编译与集成测试（JDK 17）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: admin_starter_test
          MYSQL_USER: admin_app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        env:
          REDIS_PASSWORD: ci-redis-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # 测试库由 Flyway 自动建表（V1..V16）+ 灌种子数据，因此容器里只建空库即可
      APP_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/admin_starter_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&rewriteBatchedStatements=true
      APP_TEST_DB_USERNAME: admin_app
      APP_TEST_DB_PASSWORD: ci-app-password
      APP_REDIS_HOST: 127.0.0.1
      APP_REDIS_PORT: '6379'
      APP_REDIS_PASSWORD: ci-redis-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # -pl web -am：只构建 web 及其依赖模块（common / system / auth），与本地验证口径一致。
      # 这里刻意不再加 -DskipTests：后端唯一的集成测试必须真的跑，否则"绿"只证明能编译。
      - name: Build and test
        working-directory: server
        run: mvn -B -pl web -am verify
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/**/target/surefire-reports
          retention-days: 7

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # 单元/组件测试（Vitest，无服务依赖，秒级）：ADR-006
      - name: Unit tests
        run: pnpm --filter @admin-starter/pc test:unit
      # apps/pc 的 build = vue-tsc -b && vite build
      - name: Build
        run: pnpm build
      # 业务 chunk 体积门禁：第三方依赖按 vendor-* 分包后（见 apps/pc/vite.config.ts），
      # 业务入口应保持很小；它反弹意味着又把大依赖静态引入了主包，构建期发现比线上慢一截更好。
      - name: 业务 chunk 体积门禁（≤ 400KB）
        run: |
          node -e "
          const fs = require('fs');
          const dir = 'apps/pc/dist/assets';
          const files = fs.readdirSync(dir).filter((n) => /^index-.*\.js$/.test(n));
          if (!files.length) { console.error('未找到业务入口 chunk'); process.exit(1); }
          const max = Math.max(...files.map((n) => fs.statSync(dir + '/' + n).size));
          console.log('业务入口 chunk 最大体积：' + max + ' 字节（上限 ' + 400 * 1024 + '）');
          if (max > 400 * 1024) { console.error('业务 chunk 超过 400KB：请检查是否把大依赖静态引入主包'); process.exit(1); }
          "

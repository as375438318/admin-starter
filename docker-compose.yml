# 一键起全栈（P1-1 可交付性）。用法见 docs/design/deployment.md：
#   cp .env.example .env   # 改口令
#   docker compose up -d --build
#
# 设计要点（都不是随便写的）：
# 1. **只有 web 对外发布端口**。后端、MySQL、Redis 只在内网 bridge 上，
#    这样 /actuator/prometheus（无鉴权）不会被公网直接抓到。
# 2. 口令**一律来自环境变量**，镜像里不含任何口令；.env 已在 .gitignore 里。
# 3. 依赖用健康检查门控（service_healthy），避免后端抢在 MySQL 初始化前启动后狂重试。
# 4. 上传目录挂卷：否则容器重建后文件字节丢失，数据库记录会指向不存在的文件。
# 5. 后端用 init: true + 优雅停机（server.shutdown=graceful，30s 相位超时），
#    滚动发布时在途请求能处理完再退出。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-admin_starter}
      MYSQL_USER: ${MYSQL_USER:-admin_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 与后端 UTC 时间口径对齐：库里存 UTC，展示层按 Asia/Shanghai 转
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用业务账号 ping：root 口令改成只允许本机时也能工作
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 里设置 REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内端口固定 8080（覆盖 application.yml 的 8082，那是本机开发端口）
      SERVER_PORT: "8080"
      APP_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-admin_starter}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&rewriteBatchedStatements=true
      APP_DB_USERNAME: ${MYSQL_USER:-admin_app}
      APP_DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 前端经 nginx 同源访问，Origin 是站点地址；后端写操作会校验 Origin
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      # readiness 包含 DB/Redis 依赖；用它做门控，起不来就不接流量
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  uploads:
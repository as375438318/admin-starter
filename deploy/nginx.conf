# 前端站点配置：SPA 回退 + 反代后端。部署见 docs/design/deployment.md。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小与后端保持一致（app.upload.max-size 的可调值以「系统参数」为准，这里只是兜底）
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 安全头：等保最低要求（点击劫持、MIME 嗅探）。CSP 需按实际外链再收紧。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # 后端接口。路径透传：/api/v1/xxx → http://backend:8080/api/v1/xxx
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端按 Origin 做写操作校验（OriginCheckFilter），必须原样带上
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件导出/上传：放宽超时，避免 60s 默认值把慢导出掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源带指纹，长缓存；index.html 不缓存（否则发版后用户拿到旧壳）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 回退：前端是 history 路由，未知路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
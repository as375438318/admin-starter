server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: admin-starter
  profiles:
    default: dev
    group:
      dev: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/admin_starter?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&rewriteBatchedStatements=true
    username: ${APP_DB_USERNAME:admin_app}
    password: ${APP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${APP_REDIS_HOST:127.0.0.1}
      port: ${APP_REDIS_PORT:6379}
      password: ${APP_REDIS_PASSWORD:}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8
  servlet:
    multipart:
      # 容器层天花板：业务真实上限由 sys.upload.max-size 决定（1MB–200MB）
      max-file-size: 200MB
      max-request-size: 210MB
  jackson:
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cors:
    # 前端可能通过 localhost 或 127.0.0.1 访问，两者都需放行
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  job:
    # cron 计算时区：显式配置，禁止依赖 JVM 默认时区（容器镜像默认 UTC，会让 cron 整体偏移）。
    # 库内 next_run_at / 执行时间仍按 UTC 存储。
    zone: Asia/Shanghai
    scheduler-pool-size: 4
    runner-core-pool-size: 2
    runner-max-pool-size: 8
    runner-queue-capacity: 100
    task-core-pool-size: 2
    task-max-pool-size: 8
    task-queue-capacity: 100
  cache:
    type: redis
  auth:
    # 本地开发密钥；生产必须通过环境变量 APP_AUTH_SECRET 注入且不少于 32 字节
    secret: local-dev-only-secret-please-change-in-production-0123456789
    access-ttl: 15m
    refresh-ttl: 7d
    # 本地 HTTP 需要 false；生产 HTTPS 必须通过 APP_AUTH_COOKIE_SECURE=true 开启
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cookie-same-site: Lax
    max-login-failures: 5
    lock-duration: 15m
  file:
    upload-dir: ./data/uploads
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,zip

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

    post:
      x-status: IMPLEMENTED
      tags: [demo]
      summary: 导入示例任务（只新增，整批校验）
      description: |
        单批上限 20000 行，文件上限 50MB，仅支持 .xlsx；单一同步通道，单事务。
        任一行校验失败则整批不落库，返回 `422 VALIDATION_FAILED`，
        `data.errors[]` 的 `field` 形如「第 3 行 · 任务标题」，`code` 取 `REQUIRED`／`INVALID_FORMAT`／`TOO_LONG`／`VALIDATION_FAILED`；
        `data.errors` 最多返回 200 条，同时返回三个独立数字：`totalRows`（数据行数，不含表头）、`errorRows`（出错行数）、
        `errorCount`（字段级错误总数），以及 `remainingErrors`（未显示的剩余条数）。
        超过行数或体积上限返回 `400`，不转异步；同一用户 5 分钟内重复提交同一文件（SHA-256 相同）返回 `400`。
      operationId: demoTaskImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功，返回总行数与写入行数
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                allOf:

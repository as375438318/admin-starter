#           未在本文件出现的接口以实现基线 docs/api/openapi.generated.yaml 为准，不得据本文件推断“接口不存在”。
# 约束：响应信封、错误码、分页、时间与金额格式的唯一事实源是 docs/specs/api-contract.md；本文件只做实例，不重复定义。
#       逐接口状态用 x-status 表达：DRAFT / APPROVED / IMPLEMENTED / DEPRECATED（`AGENTS.md` §3）。
#       TODO 只允许写在 YAML 注释里（`AGENTS.md` §3 的合法 TODO 载体）。
# 维护：新增或修改接口时同批更新本文件并重新导出实现基线（`AGENTS.md` §6.2 第 8 步）。

openapi: 3.0.3
info:
  title: 项目基础框架 · 后台管理接口契约
  version: 1.0.2
  description: |
    本项目接口契约（手写维护，版本随接口演进递增，见 CT-VER）。
    统一响应信封见 CT-RESP-001（data 必须存在，无值时为 null）；禁止 204/空 body 见 CT-RESP-009；
    基础错误码见 CT-ERR-011；分页字段见 CT-PAGE-001，默认值与上限见 CT-PAGE-002；
    时间格式见 CT-FMT-001，金额用字符串见 CT-FMT-003；令牌协议载体见 CT-AUTH-001。
    未在本文件列出的接口以 docs/api/openapi.generated.yaml 为实现基线。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
  # TODO(OPS): 预发/生产域名与反向代理前缀待部署环境确定后补充；补齐前本契约不得作为对外交付件。

tags:
  - name: public
    description: 无需鉴权的公开接口
  - name: files
    description: 文件管理（上传、下载、删除）
  - name: notices
    description: 通知公告（管理端 + 用户端收件箱）
  - name: jobs
    description: 定时任务（任务定义、启停、手动执行、执行日志）
  - name: sessions
    description: 会话管理（登录设备、强制下线、失效清理）
  - name: demo
    description: 示例业务（导入、导出、模板下载）

paths:
  /api/v1/public/configs:
    get:
      x-status: IMPLEMENTED
      tags: [public]
      summary: 获取公开外观配置（无需鉴权）
      description: |
        返回白名单内的系统参数，供前端启动时注入浏览器标题、登录页品牌与页脚。
        只包含 sys.name / sys.name.slogan / sys.copyright / sys.icp / sys.upload.max-size（uploadMaxSize）；
        敏感参数（如 sys.security.token.secret）不在白名单内，禁止返回。
        未登录访问必须返回 200，不得返回 401。
      operationId: getPublicConfigs
      security: []
      responses:
        '200':
          description: 成功；未配置的字段为 null，由前端回落默认文案
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigResponse'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files:
    get:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 文件列表
      description: |
        受数据权限约束（`dept_id` 组织范围 + `create_by` 归属过滤）。
        只返回未删除（`deleted=0`）文件；回收站列表见 `/api/v1/files/recycle`。
      operationId: pageFiles
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 原始文件名模糊匹配
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SystemError'
    post:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 上传文件（单个）
      description: |
        multipart/form-data 单文件上传，需权限 system:file:upload。多文件由前端并发调用本接口。
        业务上限取自参数 sys.upload.max-size（1MB–200MB，热生效）；超过当前上限返回 413，
        message 写明真实上限，data.maxSize 给出上限字节数，供前端就地提示。
        容器天花板 200MB 由 spring.servlet.multipart 启动期固定，超过时由容器直接拒绝（message 为“请求体过大”，data 为 null）。
        服务端计算 SHA-256；若同一上传者已有相同内容，复用物理字节并返回 instant=true。
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传文件
      responses:
        '200':
          description: 上传成功，返回文件记录
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/{id}:
    delete:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 删除文件（移入回收站）
      description: |
        逻辑删除：置 deleted=1、deleted_at、deleted_by，物理字节保留。记录不存在时仍返回成功，保证重复删除幂等（CT-HTTP-002）。
        彻底删除见 DELETE /api/v1/files/recycle/{id}；恢复见 POST /api/v1/files/{id}/restore。
      operationId: deleteFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已移入回收站；重复删除同 id 仍返回 200，data 为 null
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/instant:
    post:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 秒传探测
      description: |
        需权限 system:file:upload。仅当**当前上传者**存在相同 sha256+size 且物理文件存在时，
        创建一条新文件记录并返回 instant=true（不重复存字节）；否则 instant=false，客户端继续真实上传。
        不跨用户秒传，避免知道 hash 即复制他人文件。
      operationId: instantUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstantUploadRequest'
      responses:
        '200':
          description: instant=true 时 data 为新建文件记录；false 时 data 为空对象
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/{id}/preview:
    get:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 在线预览（仅图片与 PDF）
      description: |
        需权限 system:file:download。仅 jpg/jpeg/png/gif/webp/pdf 可预览，返回 inline 与 nosniff；
        其他类型 422，只能走下载接口。越权与不存在统一返回 404（同一文案，不暴露资源是否存在，见 CT-HTTP-008）；
        缺功能权限（无 system:file:download）返回 403。
      operationId: previewFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: '文件流（Content-Disposition: inline）'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/files/recycle:
    get:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 回收站列表
      description: |
        需权限 system:file:list。只返回 deleted=1 的文件，受数据权限约束；按删除时间倒序。
      operationId: pageRecycledFiles
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/{id}/restore:
    post:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 从回收站恢复
      description: |
        需权限 system:file:restore。deleted=1 → 0，清空删除标记；不在回收站时仍返回成功（幂等）。
      operationId: restoreFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 恢复成功；data 为 null
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/recycle/{id}:
    delete:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 彻底删除（回收站）
      description: |
        需权限 system:file:purge。物理删除记录；仅当没有其他记录（含回收站行）引用同一 storage_path 时才删物理字节。
        仅允许删除回收站记录（deleted=1）；正常记录返回 422，需先删除进回收站。不存在时返回 200 幂等。
      operationId: purgeFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 彻底删除成功；data 为 null
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/chunk-sessions:
    post:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 初始化分片上传
      description: |
        需权限 system:file:upload。校验文件名、扩展名、总大小与分片数；
        若同一上传者命中秒传，返回 instant=true 与文件记录，不再上传分片。
        chunkSize 允许 256KB–5MB，totalChunks ≤ 1000；会话 24 小时无更新由孤儿清理任务置 EXPIRED。
      operationId: initChunkSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkInitRequest'
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/chunk-sessions/{uploadId}:
    get:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 查询分片进度（断点续传）
      description: 需权限 system:file:upload；会话必须属于当前上传者，否则 403。返回已上传分片序号。
      operationId: getChunkSession
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/SystemError'
    delete:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 放弃分片上传
      description: 需权限 system:file:upload；标记 ABORTED 并立即删除临时分片目录。重复放弃幂等。
      operationId: abortChunkSession
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功；data 为 null
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/chunk-sessions/{uploadId}/chunks/{index}:
    put:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 上传单个分片
      description: |
        需权限 system:file:upload。multipart 字段 `chunk`；index 从 0 开始且小于 totalChunks；
        重复上传同一分片覆盖旧片。单分片不得超过初始化声明的 chunkSize。
      operationId: uploadChunk
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chunk]
              properties:
                chunk:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功；data 为当前已上传分片序号
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/files/chunk-sessions/{uploadId}/complete:
    post:
      x-status: IMPLEMENTED
      tags: [files]
      summary: 完成分片上传
      description: |
        需权限 system:file:upload。校验所有分片齐全、合并后字节数与 SHA-256 与初始化一致，
        写入最终逻辑键并创建文件记录，删除临时目录。校验失败返回 422 且保留会话供重试。
      operationId: completeChunkSession
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 上传成功，返回文件记录
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/notices:
    get:
      x-status: IMPLEMENTED
      tags: [notices]
      summary: 通知列表（管理端）
      description: |
        受数据权限约束：按发布人部门（dept_id）与发布人（create_by）收敛。
        支持关键词、级别、类型、状态筛选；默认按发布时间倒序。
      operationId: pageNotices
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [NORMAL, IMPORTANT, URGENT]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [SYSTEM, BUSINESS, SECURITY, TASK]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PUBLISHED, REVOKED]
        - name: deptId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SystemError'
    post:
      x-status: IMPLEMENTED
      tags: [notices]
      summary: 发布通知
      description: |
        接收范围多行并集；DEPT 固定为“该部门及其全部下级部门”。
        发布时把范围展开为应读人快照（sys_notice_recipient），之后组织调整不补发。
        需要权限 system:notice:create。
      operationId: publishNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticePublishRequest'
      responses:
        '200':
          description: 发布成功，返回通知详情
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/notices/{id}:
    get:
      x-status: IMPLEMENTED
      tags: [notices]
      summary: 通知详情（管理端）
      description: 受数据权限约束；越权访问返回 404。
      operationId: getNotice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/SystemError'
    delete:
      x-status: IMPLEMENTED
      tags: [notices]
      summary: 删除通知

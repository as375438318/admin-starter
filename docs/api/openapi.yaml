      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportTaskItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/posts/export-tasks/{id}/cancel:
    post:
      x-status: IMPLEMENTED
      tags: [system]
      summary: 取消岗位导出任务
      description: 仅 `PENDING`/`RUNNING` 可取消。
      operationId: postExportCancel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功，返回最新任务状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExportTaskItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/SystemError'

  /api/v1/posts/export-tasks/{id}/file:
    get:
      x-status: IMPLEMENTED
      tags: [system]
      summary: 下载岗位导出文件
      description: 仅任务发起人可下载；仅 `SUCCESS` 且未过期可用。临时文件独立区存储，不进 `sys_file`。
      operationId: postExportFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功，返回 xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/SystemError'

components:
  headers:
    XTraceId:
      description: 链路标识，必须与响应体 traceId 一致（CT-TRACE-002）
      schema:
        type: string
    IdempotentReplay:
      description: 幂等重放标记，重放时返回 true（CT-IDEM-003）
      schema:
        type: string
        enum: ['true']
  schemas:
    Envelope:
      type: object
      description: 统一响应信封，字段定义方为 CT-RESP-001
      required: [code, message, data, traceId]
      properties:
        code:
          type: integer
          description: 成功为 0；失败为基础码或项目扩展码（CT-ERR-011）
        message:
          type: string
          description: 默认可直接展示的文案
        data:
          nullable: true
          description: 业务数据；无数据时为 null，不得省略
        traceId:
          type: string
          description: 链路标识，见 CT-TRACE-001
    FieldError:
      type: object
      description: 字段校验错误结构，定义方为 CT-ERR-006
      required: [field, code, message]
      properties:
        field:
          type: string
          description: 字段路径，如 name
        code:
          type: string
          description: 字段级错误符号名，取值见 CT-ERR-006 的四值枚举
        message:
          type: string
    ErrorData:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ImportErrorData:
      type: object
      required: [errors, totalRows, errorRows, errorCount, remainingErrors]
      properties:
        errors:
          type: array
          description: 最多 200 条；`field` 形如「第 3 行 · 任务标题」
          items:
            $ref: '#/components/schemas/FieldError'
        totalRows:
          type: integer
          description: 本次上传的数据行数（不含表头）
        errorRows:
          type: integer
          description: 存在至少一处错误的行数（同一行多字段错误只计 1 行）
        errorCount:
          type: integer
          description: 字段级错误总数（同一行多个字段错误分别计数）
        remainingErrors:
          type: integer
          description: 未显示的剩余错误条数；等于 errorCount - errors.size()
    FileRecord:
      type: object
      description: 文件记录；字段与 FileDtos.Response 一致
      required: [id, originalName, size, createdAt, downloadUrl]
      properties:
        id:
          type: integer
          format: int64
        originalName:
          type: string
          description: 上传时的原始文件名
        contentType:
          type: string
          nullable: true
        size:
          type: integer
          format: int64
          description: 文件字节数
        uploaderId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          description: 下载地址（/api/v1/files/{id}/download）
        previewUrl:
          type: string
          nullable: true
          description: 预览地址（/api/v1/files/{id}/preview）；仅图片/PDF 非空，其余为 null
        instant:
          type: boolean
          nullable: true
          description: 本次上传是否命中秒传（历史记录为 null）
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: 进入回收站时间；正常文件为 null
        deletedBy:
          type: integer
          format: int64
          nullable: true
    FilePageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/FileRecord'
                total:
                  type: integer
                  format: int64
    InstantUploadRequest:
      type: object
      required: [fileName, size, sha256]
      properties:
        fileName:
          type: string
          maxLength: 255
        size:
          type: integer
          format: int64
        contentType:
          type: string
          maxLength: 128
          nullable: true
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    InstantUploadResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [instant]
              properties:
                instant:
                  type: boolean
                file:
                  nullable: true
                  allOf:
                    - $ref: '#/components/schemas/FileRecord'
    ChunkInitRequest:
      type: object
      required: [fileName, size, sha256, chunkSize]
      properties:
        fileName:
          type: string
          maxLength: 255
        size:
          type: integer
          format: int64
        contentType:
          type: string
          maxLength: 128
          nullable: true
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        chunkSize:
          type: integer
          description: 分片字节数，256KB–5MB
    ChunkSessionResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [uploadId, chunkSize, totalChunks, uploadedChunks, instant]
              properties:
                uploadId:
                  type: string
                  description: 32 位十六进制会话标识
                chunkSize:
                  type: integer
                totalChunks:
                  type: integer
                uploadedChunks:
                  type: array
                  items:
                    type: integer
                instant:
                  type: boolean
                  description: 命中秒传时为 true，此时 file 非空
                file:
                  nullable: true
                  allOf:
                    - $ref: '#/components/schemas/FileRecord'
    FileResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FileRecord'
    PublicConfigResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        # allOf 成员必须显式声明 additionalProperties：缺失时校验器按「关闭」处理，
        # 会把信封里的 code/message/traceId 误判为多余字段（2026-11-11 契约测试发现）
        - type: object
          additionalProperties: true
          properties:
            data:
              type: object
              description: 白名单公开参数；未配置时为 null，前端回落默认值
              required: [name, slogan, copyright, icp, uploadMaxSize]
              properties:
                name:
                  type: string
                  nullable: true
                  description: 对应 sys.name；显示在浏览器标题、登录页品牌与侧栏
                slogan:
                  type: string
                  nullable: true
                  description: 对应 sys.name.slogan；登录页副标题
                copyright:
                  type: string
                  nullable: true
                  description: 对应 sys.copyright；登录页页脚版权
                icp:
                  type: string
                  nullable: true
                  description: 对应 sys.icp；登录页页脚备案号
                uploadMaxSize:
                  type: integer
                  format: int64
                  minimum: 1048576
                  maximum: 209715200
                  description: 单个文件上传上限（字节），对应 sys.upload.max-size；1MB–200MB，200MB 为容器天花板
    NoticeScope:
      type: object
      required: [scopeType, targetId, targetName]
      properties:
        scopeType:
          type: string
          enum: [ALL, ROLE, DEPT, USER]
        targetId:
          type: integer
          format: int64
          nullable: true
          description: ROLE=角色 id；DEPT=部门 id；USER=用户 id；ALL 为 null
        targetName:
          type: string
          nullable: true
          description: 展示名；DEPT 追加“（含下级）”
    NoticeReadStats:
      type: object
      required: [totalRecipients, readCount, unreadCount]
      properties:
        totalRecipients:
          type: integer
          format: int64
          description: 应读人数（发布时快照）
        readCount:
          type: integer
          format: int64
        unreadCount:
          type: integer
          format: int64
    Notice:
      type: object
      required: [id, title, level, type, revocable, revoked, publishedAt, scopes, stats]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        content:
          type: string
          nullable: true
          description: 纯文本；列表接口为 null，详情接口返回全文
        level:
          type: string
          enum: [NORMAL, IMPORTANT, URGENT]
        type:
          type: string
          enum: [SYSTEM, BUSINESS, SECURITY, TASK]
        revocable:
          type: boolean
          description: 是否允许撤回；false 时撤回返回 409
        revoked:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        publisherId:
          type: integer
          format: int64
          nullable: true
          description: 发布人；系统调用为 null，展示为“系统”
        publisherName:
          type: string
        deptId:
          type: integer
          format: int64
          nullable: true
          description: 发布人部门（数据权限组织范围）
        deptName:
          type: string
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: integer
          format: int64
          nullable: true
        revokedByName:
          type: string
          nullable: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/NoticeScope'
        stats:
          $ref: '#/components/schemas/NoticeReadStats'
        createdAt:
          type: string
          format: date-time
    NoticeResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Notice'
    NoticePageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Notice'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
    NoticePublishRequest:
      type: object
      required: [title, content, scopes]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
        level:
          type: string
          enum: [NORMAL, IMPORTANT, URGENT]
          default: NORMAL
        type:
          type: string
          enum: [SYSTEM, BUSINESS, SECURITY, TASK]
          default: SYSTEM
        revocable:
          type: boolean
          default: true
        scopes:
          type: array
          minItems: 1
          items:
            type: object
            required: [scopeType]
            properties:
              scopeType:
                type: string
                enum: [ALL, ROLE, DEPT, USER]
              targetId:
                type: integer
                format: int64
                nullable: true
                description: ALL 时忽略；其余必填
    NoticeReader:
      type: object
      required: [userId, username, nickname, read]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        deptName:
          type: string
          nullable: true
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
    NoticeReaderPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/NoticeReader'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
    InboxNotice:
      type: object
      required: [id, title, level, type, publishedAt, publisherName, read]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        level:
          type: string
          enum: [NORMAL, IMPORTANT, URGENT]
        type:
          type: string
          enum: [SYSTEM, BUSINESS, SECURITY, TASK]
        publishedAt:
          type: string
          format: date-time
        publisherName:
          type: string
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
    InboxNoticePageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/InboxNotice'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
    InboxNoticeDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/InboxNotice'
                - type: object
                  required: [content]
                  properties:
                    content:
                      type: string
    UnreadCountResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  format: int64
    ReadAllResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [marked]
              properties:
                marked:
                  type: integer
                  description: 本次标记为已读的条数
    Job:
      type: object
      description: 定时任务定义；字段与 JobDtos.Response 一致
      required: [id, name, groupName, jobKey, cronExpression, status, concurrencyPolicy, timeoutSeconds, retryTimes, retryIntervalSeconds, notifyPolicy, notifyThreshold, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 64
        groupName:
          type: string
          maxLength: 64
        jobKey:
          type: string
          maxLength: 128
          description: 已注册任务标识（ScheduledJob.key），不是类名或脚本
        cronExpression:
          type: string
          maxLength: 64
          description: Spring 6 段 cron：秒 分 时 日 月 周
        description:
          type: string
          maxLength: 255
          nullable: true
        status:
          type: string
          enum: [ENABLED, DISABLED]
        concurrencyPolicy:
          type: string
          enum: [DISALLOW, ALLOW]
          description: DISALLOW 为单机进程内禁止并发，不是分布式锁
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        retryTimes:
          type: integer
          minimum: 0
          maximum: 10
          description: 首次之外的额外重试次数
        retryIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        notifyPolicy:
          type: string
          enum: [NEVER, ON_FAILURE, ON_CONSECUTIVE]
        notifyThreshold:
          type: integer
          minimum: 1
          maximum: 10
          description: 连续失败阈值，仅 ON_CONSECUTIVE 生效
        notifyTargets:
          type: string
          nullable: true
          description: 指定接收人 id，逗号分隔；空=任务创建人
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunResult:
          type: string
          nullable: true
          enum: [SUCCESS, FAIL, TIMEOUT, SKIPPED]
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: 由 cron 表达式动态计算；手动执行不改变它
        running:
          type: boolean
          description: 当前实例内是否正在执行
        registered:
          type: boolean
          description: jobKey 是否存在于代码注册表
        createdBy:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobRequest:
      type: object
      description: 新增/修改任务的请求体；不允许任何可执行脚本字段
      required: [name, jobKey, cronExpression]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        groupName:
          type: string
          maxLength: 64
          default: DEFAULT
        jobKey:
          type: string
          minLength: 1
          maxLength: 128
          description: 必须是 GET /jobs/keys 返回的已注册标识
        cronExpression:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
        status:
          type: string
          enum: [ENABLED, DISABLED]
          default: DISABLED
        concurrencyPolicy:
          type: string
          enum: [DISALLOW, ALLOW]
          default: DISALLOW
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 60
        retryTimes:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
        retryIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 10
        notifyPolicy:
          type: string
          enum: [NEVER, ON_FAILURE, ON_CONSECUTIVE]
          default: NEVER
        notifyThreshold:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        notifyTargets:
          type: string
          maxLength: 255
          description: 用户 id 逗号分隔；为空回退任务创建人
    JobStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ENABLED, DISABLED]
    JobKeyOption:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
          description: 已注册任务标识
        description:
          type: string
          description: 任务说明（来自代码）
    JobRunResult:
      type: object
      description: 单次执行摘要；字段与 JobDtos.RunResponse 一致
      required: [logId, result, elapsedMs, attemptCount, startedAt, finishedAt]
      properties:
        logId:
          type: integer
          format: int64
        result:
          type: string
          enum: [SUCCESS, FAIL, TIMEOUT, SKIPPED]
        elapsedMs:
          type: integer
          format: int64
          description: 含重试间隔的耗时
        attemptCount:
          type: integer
          description: 实际执行次数（首次 + 重试）
        affectedRows:
          type: integer
          format: int64
          nullable: true
        errorSummary:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    JobPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Job'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
    JobResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Job'
    JobKeyOptionListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/JobKeyOption'
    JobRunResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobRunResult'
    JobLog:
      type: object
      description: 一次触发一行的执行日志；字段与 JobLogDtos.Response 一致
      required: [id, jobId, jobName, jobKey, triggerType, startedAt, finishedAt, elapsedMs, result, attemptCount]
      properties:
        id:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        jobName:
          type: string
          description: 执行时的任务名快照
        jobKey:
          type: string
        triggerType:
          type: string
          enum: [AUTO, MANUAL]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        elapsedMs:
          type: integer
          format: int64
        result:
          type: string
          enum: [SUCCESS, FAIL, TIMEOUT, SKIPPED]
        attemptCount:
          type: integer
        errorSummary:
          type: string
          nullable: true
        affectedRows:
          type: integer
          format: int64
          nullable: true
    JobLogDetail:
      allOf:
        - $ref: '#/components/schemas/JobLog'
        - type: object
          properties:
            errorStack:
              type: string
              nullable: true
              description: 异常堆栈（截断）
    JobLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:

              $ref: '#/components/schemas/JobLogDetail'
    Session:
      type: object
      description: 会话记录；字段与 UserSessionAppService 的 DTO 一致
      required: [id, userId, username, loginAt, lastActiveAt, deviceType, online]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        username:
          type: string
          description: 登录账号快照
        nickname:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        deviceType:
          type: string
          enum: [PC, MOBILE, TABLET, UNKNOWN]
        browser:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        loginAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        invalidatedAt:
          type: string
          format: date-time
          nullable: true
        invalidateReason:
          type: string
          nullable: true
          enum: [LOGOUT, KICKED_BY_ADMIN, PASSWORD_CHANGED, ACCOUNT_DISABLED, USER_DELETED]
        online:
          type: boolean
          description: invalidatedAt 为空且 lastActiveAt 在最近 5 分钟内
        current:
          type: boolean
          description: 仅用户端返回；是否为本次请求所在会话
    SessionPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/Session'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
    SessionListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Session'
    SessionAffectResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [affected]
              properties:
                affected:
                  type: integer
                  format: int64
                  description: 本次受影响（失效或删除）的会话条数
    CacheOverviewResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [connected, cacheType, totalKeys, unregisteredKeys, namespaces]
              properties:
                connected:
                  type: boolean
                  description: Redis 是否可连接（PING 成功）
                cacheType:
                  type: string
                  description: 当前缓存实现（redis / memory）
                usedMemoryBytes:
                  type: integer
                  format: int64
                usedMemoryHuman:
                  type: string
                maxMemoryBytes:
                  type: integer
                  format: int64
                  description: 0 表示未设置上限
                maxMemoryHuman:
                  type: string
                maxMemoryPolicy:
                  type: string
                totalKeys:
                  type: integer
                  format: int64
                  description: Redis DBSIZE
                unregisteredKeys:
                  type: integer
                  format: int64
                  description: 不属于任何已登记命名空间的 key 数量（只读）
                namespaces:
                  type: array
                  items:
                    $ref: '#/components/schemas/CacheNamespaceCount'
    CacheNamespaceCount:
      type: object
      required: [code, name, prefix, keyCount]
      properties:
        code:
          type: string
        name:
          type: string
        prefix:
          type: string
        keyCount:
          type: integer
          format: int64
    CacheNamespace:
      type: object
      required: [code, name, prefix, mode, purpose, clearEffect, sensitive, clearable, keyCount]
      properties:
        code:
          type: string
        name:
          type: string
        prefix:
          type: string
        mode:
          type: string
          enum: [EXACT, PREFIX]
        purpose:
          type: string
        clearEffect:
          type: string
          description: 清除后果，前端原样展示
        sensitive:
          type: boolean
          description: 为 true 时仅展示 key 名与 TTL，不读取 value
        clearable:
          type: boolean
        keyCount:
          type: integer
          format: int64
    CacheNamespacesResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CacheNamespace'
    CacheKey:
      type: object
      required: [name, ttlSeconds, type]
      properties:
        name:
          type: string
        ttlSeconds:
          type: integer
          format: int64
          description: -1 永久；-2 已不存在
        type:
          type: string
          description: Redis 数据类型（string/list/set/zset/hash/stream）
    CacheKeysPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize, truncated, namespace]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/CacheKey'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
                truncated:
                  type: boolean
                  description: 达到扫描批次上限仍未凑齐当前页时为 true
                namespace:
                  $ref: '#/components/schemas/CacheNamespace'
    CacheAffectResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted:
                  type: integer
                  format: int64
                  description: 本次实际删除的 key 数量
    ImportResult:
      type: object
      required: [totalRows, imported]
      properties:
        totalRows:
          type: integer
          description: 文件中解析到的有效数据行数（不含表头）
        imported:
          type: integer
          description: 实际写入行数（整批校验通过时等于 totalRows）
    ExportAccepted:
      type: object
      required: [mode, taskId]
      properties:
        mode:
          type: string
          enum: [ASYNC]
        taskId:
          type: integer
          format: int64
          description: 导出任务 ID，用于轮询详情与下载
        totalRows:
          type: integer
          description: 命中的总行数
    ExportTaskItem:
      type: object
      required: [id, status, progress]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCESS, FAILED, CANCELED, EXPIRED]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        totalRows:
          type: integer
        fileName:
          type: string
        errorMessage:
          type: string
        downloadable:
          type: boolean
          description: 是否可下载（SUCCESS 且未过期）
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    CacheCleanLog:
      type: object
      required: [id, action, deletedCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          description: CLEAR_NAMESPACE / DELETE_KEY / CLEAN_SESSION
        namespaceCode:
          type: string
        namespacePrefix:
          type: string
        keyName:
          type: string
          nullable: true
        deletedCount:
          type: integer
        username:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    CacheCleanLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [list, total, page, pageSize]
              properties:
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/CacheCleanLog'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                pageSize:
                  type: integer
  responses:
    BadRequest:
      description: 参数格式错误（400），如 JSON 无法解析
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Unauthorized:
      description: >-
        未认证（401）。分码：20101 未登录或登录已过期；20102 登录状态已过期；
        20103 账号已被停用；20104 账号已被删除；20105 登录状态已失效；
        20106 密码已被重置；20107 密码已修改；20108 已被管理员下线。
        前端对 20103/20104/20106/20107/20108 不重试刷新令牌，直接回登录页并展示对应文案。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Forbidden:
      description: 缺功能权限（403）
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: 不存在或越权访问他人资源（404）
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Conflict:
      description: 状态冲突（409）
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    ValidationError:
      description: 字段校验失败（422）
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ErrorData'
    ImportValidationError:
      description: |
        导入校验失败（422）：整批不落库。`data.errors` 最多 200 条，
        `totalRows`／`errorRows`／`errorCount` 为三个独立数字，`remainingErrors` 为未显示条数。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportErrorData'
    TooManyRequests:
      description: 触发限流（429）
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    PayloadTooLarge:
      description: |
        文件超过当前业务上限（413）。data.maxSize 为当前上限字节数，来自参数 sys.upload.max-size；
        message 已写明真实上限，可直接展示。
        例外：超过容器天花板 200MB 时由 Spring Multipart 直接拒绝，data 为 null、message 为“请求体过大”。
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [maxSize]
                    properties:
                      maxSize:
                        type: integer
                        format: int64
                        description: 当前业务上限（字节），来自 sys.upload.max-size
          example:
            code: 10002
            message: 文件大小不能超过 1MB
            data:
              maxSize: 1048576
            traceId: 3f1a2b4c5d6e7f8091a2b3c4d5e6f708
    SystemError:
      description: 系统错误（500）
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'

